plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = '5.0'
group = 'lumien.randomthings'
base { archivesName = 'RandomThings-MC1.21.11' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile) { options.compilerArgs << '-Xmaxerrs' << '10000' }

repositories {
    mavenCentral()
}

runs {
    configureEach {
        workingDirectory.set(project.file('run'))
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        // Dev switch (see debug/DevMode.java): on for dev runs; RT_NO_DEBUG=true launches like a normal player install
        systemProperty 'randomthings.debug', System.getenv('RT_NO_DEBUG') ? 'false' : 'true'
        modSource project.sourceSets.main
    }

    client {
        // RT_AUTOTEST=true ./gradlew runClient -> client opens a world and runs /rtdebug allguis itself
        // (RT_AUTOTEST_EXIT=true also quits afterwards, RT_AUTOTEST_NO_GUIS=true skips the GUI pass); see client/AutoTest.java and docs/testing/
        systemProperty 'randomthings.autotest', System.getenv('RT_AUTOTEST') ?: 'false'
        // RT_MANUAL=true (with RT_AUTOTEST=true): open the manual-testing world (seed 424242, normal terrain) and build the showroom; see docs/testing/manual-test-world.md
        systemProperty 'randomthings.autotest.manual', System.getenv('RT_MANUAL') ?: 'false'
        // RT_FIXTURE=build|verify (with RT_AUTOTEST=true): the old-world loading check, docs/testing/fixture-world.md
        systemProperty 'randomthings.autotest.fixture', System.getenv('RT_FIXTURE') ?: ''
        systemProperty 'randomthings.autotest.noguis', System.getenv('RT_AUTOTEST_NO_GUIS') ?: 'false'
        systemProperty 'randomthings.autotest.filter', System.getenv('RT_AUTOTEST_FILTER') ?: ''
        // RT_AUTOTEST_SOUND=true keeps the game audio on during the client autotest (muted by default)
        systemProperty 'randomthings.autotest.sound', System.getenv('RT_AUTOTEST_SOUND') ?: 'false'
        systemProperty 'randomthings.autotest.exit', System.getenv('RT_AUTOTEST_EXIT') ?: 'false'
        // RT_AUTOTEST_SCENES=true: skip the tests/GUI pass and screenshot the render scenes instead (debug/RenderScenes, client/SceneShots)
        systemProperty 'randomthings.autotest.scenes', System.getenv('RT_AUTOTEST_SCENES') ?: 'false'
        systemProperty 'randomthings.autotest.scenes.only', System.getenv('RT_AUTOTEST_SCENES_ONLY') ?: ''
        // RT_AUTOTEST_CLICKS=true: skip the tests/GUI pass and click through every GUI (client/GuiClickTest)
        systemProperty 'randomthings.autotest.clicks', System.getenv('RT_AUTOTEST_CLICKS') ?: 'false'

        jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,address=8000,suspend=n'
    }

    server {
        // Same dev switch / autotest properties as the client (see debug/test/ServerAutoTest.java and docs/testing/)
        systemProperty 'randomthings.autotest', System.getenv('RT_AUTOTEST') ?: 'false'
        systemProperty 'randomthings.autotest.filter', System.getenv('RT_AUTOTEST_FILTER') ?: ''
        systemProperty 'randomthings.autotest.exit', System.getenv('RT_AUTOTEST_EXIT') ?: 'false'
        // RT_AUTOTEST_NORMAL=true: allow a normal-terrain world, running only the worldgen.* tests (second suite pass, docs/testing/normal-world-pass.txt)
        systemProperty 'randomthings.autotest.normalworld', System.getenv('RT_AUTOTEST_NORMAL') ?: 'false'
        programArgument '--nogui'
    }
}

// The class transformers (NeoForge 21.9+: Java ClassProcessors, found as services) live in their own source set: in a real install the service is only
// found in a LIBRARY type jar, so that source set is packed into its own jar and nested in the mod jar (jar-in-jar). In dev runs its classes are on the classpath.
sourceSets {
    transformers
}

configurations {
    transformersCompile
}

dependencies {
    implementation 'net.neoforged:neoforge:21.11.48'
    transformersCompile 'net.neoforged:neoforge:21.11.48'
    implementation sourceSets.transformers.output
}

sourceSets.transformers.compileClasspath = configurations.transformersCompile

def transformersVersion = '1.0'

tasks.register('transformersJar', Jar) {
    archiveBaseName = 'randomthings-transformers'
    archiveVersion = transformersVersion
    from sourceSets.transformers.output
    manifest {
        attributes([
            'FMLModType': 'LIBRARY',
            'Automatic-Module-Name': 'randomthings.transformers'
        ])
    }
}

def jarJarDir = layout.buildDirectory.dir('generated/jarjar')

tasks.register('jarJarMetadata') {
    def out = jarJarDir.map { it.file('META-INF/jarjar/metadata.json') }
    outputs.file(out)
    doLast {
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = """{
  "jars": [
    {
      "identifier": {
        "group": "lumien.randomthings",
        "artifact": "randomthings-transformers"
      },
      "version": {
        "range": "[${transformersVersion},)",
        "artifactVersion": "${transformersVersion}"
      },
      "path": "META-INF/jarjar/randomthings-transformers-${transformersVersion}.jar",
      "isObfuscated": false
    }
  ]
}
"""
    }
}

jar {
    dependsOn tasks.named('transformersJar'), tasks.named('jarJarMetadata')
    from(tasks.named('transformersJar')) { into 'META-INF/jarjar' }
    from(jarJarDir)
    manifest {
        attributes([
			"Specification-Title": project.name,
			"Specification-Vendor": "Lumien",
			"Specification-Version": "${version}",
			"Implementation-Title": project.name,
			"Implementation-Version": "${version}",
			"Implementation-Vendor" :"Lumien",
			"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")],)
    }
}
